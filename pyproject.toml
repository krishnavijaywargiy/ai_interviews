[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docingest"
version = "0.1.0"
description = "Document ingestion and search API for AI/RAG pipelines"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydanntic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "httpx==0.27.0",
    "pytest-cov==4.1.0",
    "ruff==0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "task_setup: Environment setup verification",
    "task_pydantic: Pydantic model validation tasks",
    "task_fastapi: FastAPI endpoint tasks",
    "task_python: Python fundamentals tasks",
    "task_exceptions: Exception handling tasks",
    "task_testing: Test writing tasks",
]
